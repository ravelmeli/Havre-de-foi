<!doctype html>
<html lang="fr" data-composition-variables='[{"id":"hook","type":"string","label":"Texte d accroche (0-4,6 s)","default":"TOUT TE MANQUE ?"},{"id":"watermark","type":"string","label":"Filigrane","default":"HAVRE DE FOI"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1920px; overflow:hidden; background:#1a1208; }
      #root { position:relative; width:1080px; height:1920px; overflow:hidden; font-family:"Montserrat",sans-serif; }
      .bg { position:absolute; left:0; top:0; width:1080px; height:1920px; object-fit:cover; }
      #scrim { position:absolute; inset:0; background:linear-gradient(to bottom,rgba(0,0,0,.28) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,.4) 42%,rgba(0,0,0,.5) 62%,rgba(0,0,0,.35) 100%); }
      #logo { position:absolute; left:40px; top:70px; width:170px; height:170px; object-fit:contain; }
      #wm { position:absolute; left:0; right:0; top:1370px; text-align:center; font-weight:600; font-size:64px; letter-spacing:.08em; color:rgba(255,255,255,.6); text-shadow:0 2px 12px rgba(0,0,0,.5); }
      #hook { position:absolute; left:60px; right:60px; top:560px; text-align:center; font-weight:900; font-size:104px; line-height:1.1; color:#fff;
        text-shadow:0 4px 24px rgba(0,0,0,.6); }
      #hook b { color:#F6D58E; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="80" data-width="1080" data-height="1920">
      <video id="b1" class="clip bg" src="assets/s_1_wheat_sunrise.mp4" muted playsinline data-start="0"    data-duration="8.6"  data-track-index="0"></video>
      <video id="b2" class="clip bg" src="assets/s_2_wheat_sunset.mp4"  muted playsinline data-start="8.0"  data-duration="13.1" data-track-index="0"></video>
      <video id="b3" class="clip bg" src="assets/s_3_wheat_gold.mp4"    muted playsinline data-start="20.5" data-duration="10.1" data-track-index="0"></video>
      <video id="b4" class="clip bg" src="assets/s_4_birds.mp4"         muted playsinline data-start="30.0" data-duration="14.1" data-track-index="0"></video>
      <video id="b5" class="clip bg" src="assets/s_5_clouds.mp4"        muted playsinline data-start="43.5" data-duration="12.1" data-track-index="0"></video>
      <video id="b6" class="clip bg" src="assets/s_6_golden_sky.mp4"    muted playsinline data-start="55.0" data-duration="11.6" data-track-index="0"></video>
      <video id="b7" class="clip bg" src="assets/s_7_sun_rise.mp4"      muted playsinline data-start="66.0" data-duration="14.0" data-track-index="0"></video>
      <div id="scrim" class="clip" data-start="0" data-duration="80" data-track-index="1"></div>

      <div id="hook" class="clip" data-start="0" data-duration="4.6" data-track-index="2"><span data-var-text="hook">TOUT TE MANQUE ?</span></div>

      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="80" data-track-index="3" data-track-kind="captions" data-width="1080" data-height="1920"></div>
      <div id="verses" data-composition-id="verses" data-composition-src="compositions/verses.html" data-start="0" data-duration="80" data-track-index="4" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="subscribe" data-composition-id="subscribe" data-composition-src="compositions/subscribe.html" data-start="69.8" data-duration="10.2" data-track-index="5" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <img id="logo" class="clip" src="assets/logo.png" data-start="0" data-duration="80" data-track-index="6" />
      <div id="wm" class="clip" data-layout-allow-safe-zone data-start="0" data-duration="80" data-track-index="7"><span data-var-text="watermark">HAVRE DE FOI</span></div>

      <audio id="voice" src="assets/voice.wav" data-start="0" data-duration="73.7" data-track-index="8" data-volume="1"></audio>
      <audio id="music" src="assets/music.mp3" data-start="0" data-duration="80" data-track-index="9" data-volume="0.2" data-fade-in="1.5" data-fade-out="3"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const slots = [["#b1",0,8.6],["#b2",8.0,13.1],["#b3",20.5,10.1],["#b4",30.0,14.1],["#b5",43.5,12.1],["#b6",55.0,11.6],["#b7",66.0,14.0]];
      slots.forEach(([id,s,d],i) => {
        tl.fromTo(id, { scale: 1.0 }, { scale: 1.07, duration: d, ease: "none" }, s);
        if (i > 0) tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.inOut" }, s);
        if (i < slots.length - 1) tl.to(id, { opacity: 0, duration: 0.6, ease: "power1.inOut" }, s + d - 0.6);
      });
      tl.to("#hook", { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" }, 4.2);
      tl.fromTo("#logo", { opacity: 0 }, { opacity: 0.95, duration: 0.6 }, 0.2);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
